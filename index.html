<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FCWG Fleet Tracker</title>
<meta name="theme-color" content="#1f3b57">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fleet Tracker">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#fff}
  #app{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;border:0;display:block}
  #direct{position:fixed;right:6px;bottom:calc(6px + env(safe-area-inset-bottom));z-index:2;
    font:11px/1.2 system-ui,Arial,sans-serif;color:#555;background:rgba(255,255,255,.75);
    padding:3px 7px;border-radius:10px;text-decoration:none;opacity:.6}
  #direct:hover,#direct:focus{opacity:1}
</style>
</head>
<body>
<iframe id="app" title="FCWG Fleet Tracker"
  src="https://script.google.com/macros/s/AKfycbzuTCYwK9Lymz1pwEEC308VzOGGPU1WngGBIe1kXAHzvlrW3L14H9w1uHR9oJU6F-Qx/exec?authuser=0"
  allow="clipboard-read; clipboard-write; geolocation; camera; fullscreen"
  allowfullscreen></iframe>
<a id="direct" target="_blank" rel="noopener"
  href="https://script.google.com/macros/s/AKfycbzuTCYwK9Lymz1pwEEC308VzOGGPU1WngGBIe1kXAHzvlrW3L14H9w1uHR9oJU6F-Qx/exec?authuser=0">Open directly</a>
<script>
  (function () {
    var base = 'https://script.google.com/macros/s/AKfycbzuTCYwK9Lymz1pwEEC308VzOGGPU1WngGBIe1kXAHzvlrW3L14H9w1uHR9oJU6F-Qx/exec';
    // authuser=0 stops Google rewriting the link to /macros/u/N/ on phones signed into several accounts.
    var qs = (location.search || '').replace(/^\?/, '');
    if (qs) {
      var url = base + '?authuser=0&' + qs;
      document.getElementById('app').src = url;
      document.getElementById('direct').href = url;
    }
  })();
</script>
</body>
</html>
